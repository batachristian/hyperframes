<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Nunito", sans-serif;
    }
    #spin-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
    #spin-shadow {
      position: absolute;
      left: 290px;
      top: 1262px;
      width: 500px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(0, 10, 40, 0.55), rgba(0, 10, 40, 0));
    }
    #spin-canwrap {
      position: absolute;
      left: 163px;
      top: 238px;
      width: 755px;
      height: 1110px;
    }
    #spin-can {
      width: 755px;
      height: 1110px;
      display: block;
    }
    .spin-beat {
      position: absolute;
      left: 60px;
      right: 60px;
      top: 176px;
      text-align: center;
      color: #ffffff;
    }
    .spin-kicker {
      display: block;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #f6c21c;
      line-height: 1.1;
    }
    .spin-main {
      display: block;
      font-size: 84px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-top: 8px;
    }
    .spin-main span {
      display: inline-block;
    }
  </style>
  <div id="root" data-composition-id="spin" data-width="1080" data-height="1920">
    <div id="spin-stage">
      <div id="spin-shadow"></div>
      <div id="spin-canwrap">
        <canvas id="spin-can" width="755" height="1110"></canvas>
      </div>
    </div>

    <div id="spin-b1" class="spin-beat clip" data-start="0" data-duration="2.75">
      <span class="spin-kicker" id="spin-b1-k">Mydrinkable</span>
      <span class="spin-main"><span id="spin-b1-a">Ananas</span> <span id="spin-b1-b">·</span> <span id="spin-b1-c">Gingembre</span></span>
    </div>
    <div id="spin-b2" class="spin-beat clip" data-start="2.7" data-duration="2.35">
      <span class="spin-kicker" id="spin-b2-k">Ingrédient n°1</span>
      <span class="spin-main"><span id="spin-b2-a">Ananas</span> <span id="spin-b2-b">du Cameroun</span></span>
    </div>
    <div id="spin-b3" class="spin-beat clip" data-start="5" data-duration="2.35">
      <span class="spin-kicker" id="spin-b3-k">Pressé avec</span>
      <span class="spin-main"><span id="spin-b3-a">citron</span> <span id="spin-b3-b">&amp; gingembre</span></span>
    </div>
    <div id="spin-b4" class="spin-beat clip" data-start="7.3" data-duration="2.3">
      <span class="spin-kicker" id="spin-b4-k">Un jus</span>
      <span class="spin-main"><span id="spin-b4-a">100%</span> <span id="spin-b4-b">naturel</span></span>
    </div>
  </div>
  <script>
    (function () {
      // Geometry of the source photo (assets/can-base.webp is 719x1057).
      var S = 1.05; // display scale of the can
      var CX = 349; // can axis, in photo pixels
      var R = 232; // can radius, in photo pixels
      var TW = 1458; // one turn of the label texture (2*PI*R)
      var LABEL_Y = 288; // first photo row covered by the label texture

      var canvas = document.getElementById("spin-can");
      var ctx = canvas.getContext("2d");

      function load(src) {
        return new Promise(function (resolve) {
          var img = new Image();
          img.onload = function () {
            resolve(img);
          };
          img.onerror = function () {
            resolve(img);
          };
          img.src = src;
        });
      }

      function draw(base, label, theta) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(base, 0, 0, base.width * S, base.height * S);
        if (!label.width) return;
        var texH = label.height;
        var x0 = Math.ceil((CX - R) * S) + 1;
        var x1 = Math.floor((CX + R) * S) - 1;
        var twoPi = Math.PI * 2;
        for (var X = x0; X <= x1; X++) {
          var s = (X + 0.5) / S - CX;
          var k = Math.max(-0.999, Math.min(0.999, s / R));
          var phiS = Math.asin(k);
          var cosS = Math.cos(phiS);
          var phi = phiS + theta;
          var u = TW * (phi / twoPi + 0.25);
          u = ((u % TW) + TW) % TW;
          var du = Math.min(24, Math.max(1, 1 / (S * cosS)));
          ctx.globalAlpha = Math.min(1, 0.15 + 0.95 * Math.pow(cosS, 0.7));
          ctx.drawImage(label, u, 0, du, texH, X, LABEL_Y * S, 1, texH * S);
        }
        ctx.globalAlpha = 1;
      }

      var state = { theta: 0 };
      var tl = gsap.timeline({ paused: true });

      Promise.all([load("assets/can-base.webp"), load("assets/can-label.webp")]).then(function (imgs) {
        var base = imgs[0];
        var label = imgs[1];
        draw(base, label, 0);

        // One full 360-degree turn, landing back on the front label.
        tl.fromTo(
          state,
          { theta: 0 },
          {
            theta: Math.PI * 2,
            duration: 8.6,
            ease: "sine.inOut",
            onUpdate: function () {
              draw(base, label, state.theta);
            },
          },
          0.2,
        );

        // Arrival push: the can is already on screen at frame 0.
        tl.fromTo(
          "#spin-canwrap",
          { scale: 0.94, y: 40 },
          { scale: 1, y: 0, duration: 1.4, ease: "power3.out" },
          0,
        );

        // Text beats: words rise in, leave upward.
        var beats = [
          { id: "b1", ins: 0.0, out: 2.4 },
          { id: "b2", ins: 2.7, out: 4.7 },
          { id: "b3", ins: 5.0, out: 7.0 },
          { id: "b4", ins: 7.3, out: 8.85 },
        ];
        beats.forEach(function (b) {
          var k = "#spin-" + b.id + "-k";
          var words = document.querySelectorAll("#spin-" + b.id + " .spin-main > span");
          var first = b.ins === 0;
          if (!first) {
            tl.fromTo(
              k,
              { y: 30, opacity: 0, filter: "blur(6px)" },
              { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" },
              b.ins,
            );
            tl.fromTo(
              words,
              { y: 70, opacity: 0, filter: "blur(10px)" },
              {
                y: 0,
                opacity: 1,
                filter: "blur(0px)",
                duration: 0.45,
                ease: "power4.out",
                stagger: 0.08,
              },
              b.ins + 0.06,
            );
          } else {
            tl.fromTo(
              words,
              { y: 0, scale: 1 },
              { y: 0, scale: 1.04, duration: 2.2, ease: "none" },
              0,
            );
          }
          tl.to(
            [k].concat(Array.prototype.slice.call(words)),
            {
              y: -60,
              opacity: 0,
              filter: "blur(8px)",
              duration: 0.28,
              ease: "power2.in",
              stagger: 0.03,
            },
            b.out,
          );
        });

        // Zoom-through into the lid: the can rushes toward camera, origin on the lid.
        tl.to(
          "#spin-stage",
          {
            scale: 3.2,
            y: 520,
            filter: "blur(14px)",
            opacity: 0,
            duration: 0.55,
            ease: "power4.in",
            transformOrigin: "540px 380px",
          },
          9.0,
        );

        window.__timelines["spin"] = tl;
      });
    })();
  </script>
</template>
