<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Nunito", sans-serif;
    }
    #open-cam {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
    #open-card {
      position: absolute;
      left: 110px;
      top: 190px;
      width: 860px;
      height: 1120px;
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 40px 90px rgba(0, 8, 35, 0.55);
      perspective: 900px;
    }
    #open-lid {
      position: absolute;
      left: 0;
      top: 0;
      width: 860px;
      height: 1120px;
      object-fit: cover;
    }
    #open-hole {
      position: absolute;
      left: 176px;
      top: 336px;
      width: 116px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(closest-side, #241703 0%, #3a2606 60%, rgba(58, 38, 6, 0) 100%);
    }
    #open-tab {
      position: absolute;
      left: 202px;
      top: 273px;
      width: 446px;
      height: 188px;
      filter: drop-shadow(0 10px 8px rgba(40, 25, 0, 0.45));
    }
    .open-drop {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8d0 0%, #f9d23a 45%, #e3a90c 100%);
    }
    #open-word {
      position: absolute;
      left: 120px;
      right: 120px;
      top: 760px;
      text-align: center;
      font-size: 150px;
      font-weight: 900;
      color: #f6c21c;
      letter-spacing: -0.02em;
      text-shadow:
        0 6px 0 #0b3a8c,
        0 16px 40px rgba(0, 10, 40, 0.6);
    }
    #open-word span {
      display: inline-block;
    }
  </style>
  <div id="root" data-composition-id="open" data-width="1080" data-height="1920">
    <div id="open-cam">
      <div id="open-card" data-layout-allow-overflow>
        <img id="open-lid" src="assets/lid-open.jpg" alt="Couvercle de la canette Mydrinkable" />
        <div id="open-hole"></div>
        <img id="open-tab" src="assets/tab.webp" alt="" />
        <div id="open-drops"></div>
      </div>
      <div id="open-word" class="clip" data-start="1.0" data-duration="1.9" data-layout-allow-overlap>
        <span id="open-word-in">Pschitt&nbsp;!</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      // Seeded PRNG for the spray.
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(7);
      var holder = document.getElementById("open-drops");
      var drops = [];
      for (var i = 0; i < 26; i++) {
        var d = document.createElement("div");
        d.className = "open-drop";
        d.id = "open-drop-" + i;
        var size = 8 + Math.round(rand() * 22);
        d.style.width = size + "px";
        d.style.height = size + "px";
        d.style.left = 234 - size / 2 + "px";
        d.style.top = 370 - size / 2 + "px";
        holder.appendChild(d);
        var ang = -Math.PI / 2 + (rand() - 0.5) * 2.2;
        var dist = 160 + rand() * 360;
        drops.push({ el: d, dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist * 0.8, delay: rand() * 0.12 });
      }

      // Arrival: the lid card comes out of the zoom-through, matching its speed.
      tl.fromTo(
        "#open-card",
        { scale: 0.55, opacity: 0, filter: "blur(14px)", y: 140 },
        { scale: 1, opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "power4.out" },
        0,
      );
      // Slow push while we wait for the pop.
      tl.fromTo("#open-lid", { scale: 1 }, { scale: 1.06, duration: 2.4, ease: "none", transformOrigin: "30% 33%" }, 0);

      // The tab lifts around its rivet; the nose dips and opens the can.
      tl.fromTo(
        "#open-tab",
        { rotationY: 0, transformOrigin: "69% 60%" },
        { rotationY: -58, duration: 0.32, ease: "back.out(2)" },
        0.85,
      );
      tl.fromTo("#open-hole", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, 0.98);

      // Spray burst.
      drops.forEach(function (p) {
        tl.fromTo(
          p.el,
          { x: 0, y: 0, opacity: 0, scale: 0.4 },
          { x: p.dx, y: p.dy, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
          1.0 + p.delay,
        );
        tl.to(p.el, { opacity: 0, y: p.dy + 120, duration: 0.5, ease: "power2.in" }, 1.45 + p.delay);
      });

      // Camera kick on the pop.
      tl.fromTo("#open-cam", { x: 0, y: 0 }, { x: -14, y: 10, duration: 0.05, ease: "none" }, 1.0);
      tl.to("#open-cam", { x: 10, y: -8, duration: 0.06, ease: "none" }, 1.05);
      tl.to("#open-cam", { x: 0, y: 0, duration: 0.12, ease: "power2.out" }, 1.11);

      // "Pschitt !" lands with the pop.
      tl.fromTo(
        "#open-word-in",
        { scale: 0.4, rotation: -10, opacity: 0 },
        { scale: 1, rotation: -4, opacity: 1, duration: 0.35, ease: "back.out(2.4)" },
        1.0,
      );

      // Exit upward: the card lifts away as the pour comes in.
      tl.to(
        "#open-cam",
        { y: -700, scale: 0.8, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in" },
        2.35,
      );

      window.__timelines["open"] = tl;
    })();
  </script>
</template>
