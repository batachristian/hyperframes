  <div id="root" data-composition-id="pour" data-width="1080" data-height="1920">

      <path

    <div id="pour-l2" class="pour-line clip" data-start="1.55" data-duration="3.25">

    </div>

  <script>
    (function () {
      var NS = "http://www.w3.org/2000/svg";
      var LIP = { x: 557, y: 681 }; // lowest point of the can's mouth while pouring
      var FLOOR = 1272; // inside bottom of the glass
      var FULL = 905; // liquid surface when full

      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(42);
      var bubbleG = document.getElementById("pour-bubbles");
      var bubbles = [];
      for (var i = 0; i < 34; i++) {
        var c = document.createElementNS(NS, "circle");
        c.setAttribute("r", (2 + rand() * 5).toFixed(1));
        c.setAttribute("fill", "rgba(255,250,215,0.75)");
        bubbleG.appendChild(c);
        bubbles.push({ el: c, x: 380 + rand() * 320, phase: rand(), speed: 120 + rand() * 160, wob: rand() * 6.28 });
      }
      var splashG = document.getElementById("pour-splash");
      var splash = [];
      for (var j = 0; j < 10; j++) {
        var s = document.createElementNS(NS, "circle");
        s.setAttribute("r", (3 + rand() * 6).toFixed(1));
        s.setAttribute("fill", "#ffe066");
        splashG.appendChild(s);
        splash.push({ el: s, dx: (rand() - 0.5) * 120, h: 30 + rand() * 50, phase: rand() });
      }

      var liquid = document.getElementById("pour-liquid");
      var foam = document.getElementById("pour-foam");
      var stream = document.getElementById("pour-stream");
      var streamHi = document.getElementById("pour-stream-hi");

      function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
      }
      function ease(p) {
        return 1 - Math.pow(1 - p, 1.6);
      }

      function render(t) {
        // Liquid level: fills from 1.15 s to 3.95 s.
        var fill = ease(clamp((t - 1.15) / 2.8, 0, 1));
        var surf = FLOOR - (FLOOR - FULL) * fill;
        liquid.setAttribute("y", surf.toFixed(1));
        liquid.setAttribute("height", (FLOOR - surf + 4).toFixed(1));
        foam.setAttribute("cy", surf.toFixed(1));
        foam.setAttribute("opacity", fill > 0.02 ? "0.9" : "0");
        var halfW = 170 + (1 - (surf - 826) / 446) * 18;
        foam.setAttribute("rx", halfW.toFixed(1));

        // Stream: head falls from the lip from 1.0 s, tail leaves at 3.8 s.
        var head = clamp((t - 1.0) / 0.22, 0, 1);
        var tail = clamp((t - 3.8) / 0.25, 0, 1);
        var yTop = LIP.y + (surf - LIP.y) * tail * tail;
        var yBot = LIP.y + (surf - LIP.y) * head * head;
        if (head <= 0 || tail >= 1 || yBot - yTop < 2) {
          stream.setAttribute("d", "");
          streamHi.setAttribute("d", "");
        } else {
          var pts = [];
          for (var k = 0; k <= 12; k++) {
            var y = yTop + ((yBot - yTop) * k) / 12;
            var q = (y - LIP.y) / Math.max(1, surf - LIP.y);
            var x = LIP.x - 24 * Math.sqrt(clamp(q, 0, 1)) + Math.sin(t * 9 + q * 6) * 2.5;
            pts.push((k === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1));
          }
          var d = pts.join(" ");
          stream.setAttribute("d", d);
          streamHi.setAttribute("d", d);
          streamHi.setAttribute("stroke-dashoffset", (-t * 900).toFixed(1));
        }
        var pouring = head >= 1 && tail < 0.6;

        // Splash at the impact point.
        splash.forEach(function (p) {
          if (!pouring) {
            p.el.setAttribute("opacity", "0");
            return;
          }
          var ph = (t * 2.6 + p.phase) % 1;
          var x = LIP.x - 24 + p.dx * ph;
          var y = surf - p.h * 4 * ph * (1 - ph);
          p.el.setAttribute("cx", x.toFixed(1));
          p.el.setAttribute("cy", y.toFixed(1));
          p.el.setAttribute("opacity", (1 - ph).toFixed(2));
        });

        // Bubbles rise through whatever juice is in the glass.
        var depth = FLOOR - surf;
        bubbles.forEach(function (b) {
          if (depth < 20) {
            b.el.setAttribute("opacity", "0");
            return;
          }
          var travel = (b.phase * depth + t * b.speed) % depth;
          var y = FLOOR - 6 - travel;
          var x = b.x + Math.sin(t * 3 + b.wob) * 4;
          b.el.setAttribute("cx", x.toFixed(1));
          b.el.setAttribute("cy", y.toFixed(1));
          b.el.setAttribute("opacity", "1");
        });
      }

      var clock = { t: 0 };
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(
        clock,
        { t: 0 },
        {
          t: 5.2,
          duration: 5.2,
          ease: "none",
          onUpdate: function () {
            render(clock.t);
          },
        },
        0,
      );
      render(0);

      // Glass rises into place.
      tl.fromTo("#pour-glass", { y: 700 }, { y: 0, duration: 0.6, ease: "power3.out" }, 0.05);

      // Can arrives from the top right already tipping, then pours.
      tl.fromTo(
        "#pour-can",
        { x: 520, y: -820, rotation: -40 },
        { x: 0, y: 0, rotation: -96, duration: 0.65, ease: "power3.out" },
        0,
      );
      tl.to("#pour-can", { rotation: -125, duration: 0.45, ease: "power2.inOut" }, 0.65);
      tl.to("#pour-can", { rotation: -132, duration: 2.6, ease: "sine.inOut" }, 1.1);
      // Tilts back and leaves upward.
      tl.to("#pour-can", { rotation: -78, duration: 0.4, ease: "power2.inOut" }, 3.75);
      tl.to("#pour-can", { x: 420, y: -900, rotation: -40, duration: 0.5, ease: "power3.in" }, 4.15);

      // Claims.
      tl.fromTo(
        "#pour-l1-in",
        { x: -80, opacity: 0, filter: "blur(8px)" },
        { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
        1.2,
      );
      tl.fromTo(
        "#pour-l2-in",
        { x: -80, opacity: 0, filter: "blur(8px)" },
        { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
        1.55,
      );
      tl.to(["#pour-l1-in", "#pour-l2-in"], { y: -60, opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in", stagger: 0.05 }, 4.3);

      window.__timelines["pour"] = tl;
    })();
  </script>
